# Fine-tune hyperparameters for the six-symbol dataset (round 2).
# Base: YOLOv5 hyp.scratch-low.yaml. Changes and why:
#   degrees 0 -> 15   the markers lie on the floor and are seen at strong in-plane
#                     rotation in the source photos; without rotation augmentation
#                     the 18 training images per class only cover a few orientations.
#                     The six symbols are rotation-invariant in meaning.
#   scale 0.5 -> 0.6  the same marker appears from ~30 px to ~300 px at 640 input.
#   translate 0.1 -> 0.15  markers appear anywhere in frame, including near borders.
#   mosaic 1.0 -> 0.8      slightly fewer artificial 4-image composites (only one
#                     object per source image, so mosaics create many tiny targets).
#   lr0 0.01 -> 0.005 / lrf 0.01 -> 0.05  this is a fine-tune of the round-1 model.
#   shear/perspective stay 0: they would distort the printed symbols.
lr0: 0.005
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 15.0
translate: 0.15
scale: 0.6
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.8
mixup: 0.0
copy_paste: 0.0
close_mosaic: 10
